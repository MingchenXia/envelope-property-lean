name = "EnvelopeProperty"
version = "0.1.0"
defaultTargets = ["EnvelopeProperty"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Third-party code (see vendor/*/README.md)
[[require]]
name = "hironaka"
path = "vendor/hironaka"

[[require]]
name = "aintlib"
path = "vendor/aintlib"

[[require]]
name = "tauceti"
path = "vendor/tauceti"

[[lean_lib]]
name = "EnvelopeProperty"
globs = ["EnvelopeProperty.+"]
