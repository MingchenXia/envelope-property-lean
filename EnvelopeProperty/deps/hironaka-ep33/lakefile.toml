# Release copy of the workspace lakefile, restricted to the import closure of the release
# roots (see README.md and scripts/closure.py at the repository root): exact-module globs that are not in the
# closure are dropped.
name = "hironakaEp33"
version = "0.1.0"
license = "Apache-2.0"
licenseFiles = ["LICENSE"]
defaultTargets = ["Hironaka"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "deJongProjectivityEp33"
path = "../../../DeJongAlterations"

[[lean_lib]]
name = "Hironaka"
globs = ["Hironaka.+"]
