# Release copy of the workspace lakefile, restricted to the import closure of the release
# roots (see README.md and scripts/closure.py at the repository root): exact-module globs that are not in the
# closure are dropped.
name = "EnvelopeProperty"
version = "0.1.0"
defaultTargets = ["EnvelopeProperty"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "EnvelopeProperty"
globs = ["EnvelopeProperty.+"]

# Pinned path dependency (same repository, exact workspace revision; see RELEASE-MANIFEST.json).
[[require]]
name = "TranscendentalNakamaye"
path = "../TranscendentalNakamaye"

# The proved same-repository alteration theorem and projective geometry sources.
[[require]]
name = "deJongProjectivityEp33"
path = "../DeJongAlterations"

# Proven source compatibility port of actual characteristic-zero principalization.
[[require]]
name = "hironakaEp33"
path = "deps/hironaka-ep33"

# Exact-source local generic-freeness producer under the unchanged Mathlib pin.
[[require]]
name = "tauCetiGenericEp33"
path = "deps/tauceti-generic-ep33"

# Actual generic sheaf and ordered Cech compatibility source, exact unchanged Mathlib pin.
[[require]]
name = "aintlibEp33"
path = "deps/aintlib-ep33"

# Actual same-repository smooth-scheme analytic maps and original native germ producers.
[[require]]
name = "SGPTFormalization"
path = "../SGPTFormalization"

# Actual same-repository finite graded polynomial Hilbert–Serre source.
[[require]]
name = "BingWangEntropy"
path = "../BingWangEntropy"
